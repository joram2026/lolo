<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep rich charcoal obsidian slate -->
    <radialGradient id="spaceBg" cx="50%" cy="35%" r="70%" fx="50%" fy="25%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#141210" />
      <stop offset="100%" stop-color="#0c0a09" />
    </radialGradient>

    <!-- Glowing outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>

    <!-- Amber Gold Gradient for Left/Right Stems of M -->
    <linearGradient id="mStemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Vibrant Center Diagonal Gradient for M -->
    <linearGradient id="mCenterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Glowing Accents for MOREX X emblem -->
    <linearGradient id="xAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- Premium Filters for Glow & Shadows -->
    <filter id="heavyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Ambient Upper Lighting Overlay -->
    <radialGradient id="ambientLight" cx="50%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base App Icon Container (Premium Squircle) -->
  <rect width="512" height="512" rx="124" fill="url(#spaceBg)"/>
  
  <!-- Subtle Ambient Top Light Glow -->
  <rect width="512" height="512" rx="124" fill="url(#ambientLight)"/>

  <!-- High-Tech Inner Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.9"/>
  <rect x="22" y="22" width="468" height="468" rx="102" fill="none" stroke="#1c1917" stroke-width="1.5" opacity="0.3"/>

  <!-- Tech Dots Grid Pattern for Premium Depth -->
  <g opacity="0.12">
    <circle cx="96" cy="96" r="2.5" fill="#f59e0b"/>
    <circle cx="160" cy="96" r="2.5" fill="#f59e0b"/>
    <circle cx="224" cy="96" r="2.5" fill="#f59e0b"/>
    <circle cx="288" cy="96" r="2.5" fill="#f59e0b"/>
    <circle cx="352" cy="96" r="2.5" fill="#f59e0b"/>
    <circle cx="416" cy="96" r="2.5" fill="#f59e0b"/>
    <circle cx="96" cy="416" r="2.5" fill="#f59e0b"/>
    <circle cx="160" cy="416" r="2.5" fill="#f59e0b"/>
    <circle cx="224" cy="416" r="2.5" fill="#f59e0b"/>
    <circle cx="288" cy="416" r="2.5" fill="#f59e0b"/>
    <circle cx="352" cy="416" r="2.5" fill="#f59e0b"/>
    <circle cx="416" cy="416" r="2.5" fill="#f59e0b"/>
  </g>

  <!-- Glowing Orbit Lines -->
  <g opacity="0.25" stroke-dasharray="8 14">
    <circle cx="256" cy="256" r="180" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  </g>

  <!-- Main Dynamic MOREX 'M' Symbol -->
  <g filter="url(#heavyShadow)">
    <!-- Left Vertical Stem -->
    <path d="M 112,380 L 112,142 C 112,130 124,122 135,127 L 176,148 C 182,151 186,157 186,164 L 186,380 Z" fill="url(#mStemGrad)"/>

    <!-- Right Vertical Stem -->
    <path d="M 400,380 L 400,142 C 400,130 388,122 377,127 L 336,148 C 330,151 326,157 326,164 L 326,380 Z" fill="url(#mStemGrad)"/>

    <!-- Left Diagonal Fold into Peak Center -->
    <path d="M 186,164 L 256,310 L 226,350 L 140,172 Z" fill="url(#mCenterGrad)"/>

    <!-- Right Diagonal Fold into Peak Center -->
    <path d="M 326,164 L 256,310 L 286,350 L 372,172 Z" fill="url(#mCenterGrad)"/>

    <!-- Dynamic Central Crystal Diamond Drop Peak (X Core) -->
    <polygon points="256,150 292,225 256,300 220,225" fill="url(#xAccentGrad)" filter="url(#neonGlow)"/>
    <polygon points="256,165 280,225 256,285 232,225" fill="#ffffff"/>

    <!-- Glowing Base Connector Bar -->
    <rect x="120" y="364" width="272" height="16" rx="8" fill="url(#xAccentGrad)" filter="url(#neonGlow)"/>
    <rect x="180" y="368" width="152" height="8" rx="4" fill="#ffffff"/>
  </g>

  <!-- Gloss Overlay -->
  <path d="M 24,24 C 140,24 230,62 302,122 C 374,182 432,282 488,400 C 488,180 450,24 256,24 Z" fill="#ffffff" opacity="0.045" />

  <!-- Glowing Energy Core Node -->
  <circle cx="256" cy="225" r="7" fill="#ffffff" filter="url(#neonGlow)"/>
</svg>
