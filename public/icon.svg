<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Crisp Dark Obsidian Canvas Background -->
    <radialGradient id="cleanDarkBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Subtle Gold Border Ring -->
    <linearGradient id="goldRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.1" />
    </linearGradient>

    <!-- Facet 1: Left Pillar (Classic Metallic Gold) -->
    <linearGradient id="goldLeftPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Facet 2: Left Diagonal (High-Lighted Champagne Gold) -->
    <linearGradient id="goldLeftDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Facet 3: Right Diagonal (Rich Bronze Gold Shadow) -->
    <linearGradient id="goldRightDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Facet 4: Right Pillar (Golden Amber) -->
    <linearGradient id="goldRightPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Sharp Clean Drop Shadow for the 'M' -->
    <filter id="crispDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Clean Dark Background Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#cleanDarkBg)" />

  <!-- Subtle Border Line -->
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="url(#goldRingGrad)" stroke-width="2" />

  <!-- BOLD, HIGH-CONTRAST GEOMETRIC MONOGRAM 'M' -->
  <g filter="url(#crispDropShadow)">
    
    <!-- 1. LEFT VERTICAL PILLAR -->
    <path d="M 104 380 L 104 132 C 104 121 113 112 124 112 L 156 112 C 167 112 176 121 176 132 L 176 380 C 176 391 167 400 156 400 L 124 400 C 113 400 104 391 104 380 Z" fill="url(#goldLeftPillar)" />

    <!-- 2. LEFT DIAGONAL ARM (Overlaps down to center) -->
    <path d="M 176 132 L 256 320 L 216 348 L 142 176 Z" fill="url(#goldLeftDiag)" />

    <!-- 3. RIGHT DIAGONAL ARM (Folds down to center) -->
    <path d="M 336 132 L 256 320 L 296 348 L 370 176 Z" fill="url(#goldRightDiag)" />

    <!-- 4. RIGHT VERTICAL PILLAR -->
    <path d="M 408 380 L 408 132 C 408 121 399 112 388 112 L 356 112 C 345 112 336 121 336 132 L 336 380 C 336 391 345 400 356 400 L 388 400 C 399 400 408 391 408 380 Z" fill="url(#goldRightPillar)" />

    <!-- 5. TOP APEX CONNECTING CAP (CHEVRON TOP) -->
    <path d="M 256 190 L 296 112 L 216 112 Z" fill="url(#goldLeftDiag)" />

  </g>
</svg>
