<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Metallic Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="55%" stop-color="#121216" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>

    <!-- Outer Golden Halo Ring -->
    <linearGradient id="haloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.05" />
    </linearGradient>

    <!-- M Left Wing Gradient (Warm Amber to Gold) -->
    <linearGradient id="leftWingGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- M Right Wing Gradient (Gold to Bright Yellow) -->
    <linearGradient id="rightWingGrad" x1="100%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Central Diamond / Upward Arrow Accent -->
    <linearGradient id="centerCoreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Lower X-Cross Bridge Gradient -->
    <linearGradient id="crossBridgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.2" />
    </filter>

    <!-- Neon Glow Filter for Core Node -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Light Reflection Overlay -->
    <linearGradient id="glassLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Canvas Container (Squircle) -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Ambient Top Reflection -->
  <rect width="512" height="512" rx="120" fill="url(#glassLight)" />

  <!-- Outer Precision Border -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="url(#haloGrad)" stroke-width="2.5" />
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="#27272a" stroke-width="1" opacity="0.6" />

  <!-- Background Technical Grid Lines -->
  <g opacity="0.08" stroke="#f59e0b" stroke-width="1">
    <line x1="256" y1="60" x2="256" y2="452" stroke-dasharray="6 8" />
    <line x1="60" y1="256" x2="452" y2="256" stroke-dasharray="6 8" />
    <circle cx="256" cy="256" r="170" fill="none" stroke-dasharray="4 8" />
    <circle cx="256" cy="256" r="120" fill="none" stroke-dasharray="2 6" />
  </g>

  <!-- MOREX Main Emblem (3D Monogram M + Upward Exchange Arrow) -->
  <g filter="url(#logoShadow)">

    <!-- Left Outer Vertical Pillar -->
    <path d="M 116 376 L 116 156 C 116 142 128 132 142 136 L 180 148 C 190 151 196 160 196 170 L 196 376 Z" fill="url(#leftWingGrad)" />

    <!-- Right Outer Vertical Pillar -->
    <path d="M 396 376 L 396 156 C 396 142 384 132 370 136 L 332 148 C 322 151 316 160 316 170 L 316 376 Z" fill="url(#rightWingGrad)" />

    <!-- Left Inner Diagonal Swoosh (Forms M diagonal & X crossover) -->
    <path d="M 196 170 L 256 280 L 224 330 L 138 180 Z" fill="url(#leftWingGrad)" opacity="0.9" />

    <!-- Right Inner Diagonal Swoosh -->
    <path d="M 316 170 L 256 280 L 288 330 L 374 180 Z" fill="url(#rightWingGrad)" opacity="0.9" />

    <!-- Dynamic Central Diamond Core (Upward Momentum & High-Yield Node) -->
    <polygon points="256,128 296,204 256,280 216,204" fill="url(#centerCoreGrad)" filter="url(#coreGlow)" />
    
    <!-- Inner Radiant Core Flare -->
    <polygon points="256,148 280,204 256,260 232,204" fill="#ffffff" />

    <!-- Sleek Bottom Horizon Anchor Bar -->
    <path d="M 132 360 L 380 360 C 391 360 398 370 393 380 C 388 388 379 392 368 392 L 144 392 C 133 392 124 388 119 380 C 114 370 121 360 132 360 Z" fill="url(#crossBridgeGrad)" />
    <rect x="180" y="368" width="152" height="6" rx="3" fill="#ffffff" opacity="0.9" filter="url(#coreGlow)" />

  </g>

  <!-- Top Center Energy Point Indicator -->
  <circle cx="256" cy="204" r="6" fill="#ffffff" filter="url(#coreGlow)" />
</svg>
